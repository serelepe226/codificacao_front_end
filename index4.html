<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Listas</title>
</head>
    <body>

<!--Listas não numeradas / Não ordenadas-->

        <ul>

            <li>Javascript</li>
        </ul>


<!--Listas Numeradas / Ordenadas-->

        <ol>

            <li>Parêntesis</li>
            <li>Divisão</li>
            <li>Multiplicação</li>
            <li>Adição</li>
            <li>Subtração</li>

        </ol>

<!--Definir o tipo de numeração: A, a, 1, I, i -->

        <ol type="I">

            <li>Parêntesis</li>
            <li>Divisão</li>
            <li>Multiplicação</li>
            <li>Adição</li>
            <li>Subtração</li>

        </ol>

<!--<ol start="2"></ol> Define o número em que a lista inicia. -->

<!--<ol reversed></ol> Contagem Decrescente -->

<!--Lista de descrição (Glossário/FAQ)-->
        
        <dl>

            <dt>HTML</dt>
            <dd>Linguagem de Marcação de Hipertexto que estrutura o conteúdo</dd>

            <dt>CSS</dt>
            <dd>Folha de Estilo Comum</dd>

        </dl>

<!--Exemplo de Menu-->

        <nav aria-label="Menu Principal">

            <ul>

                <li> <a href="#inicio">Início</a> </li>
                <li> <a href="#sobre">Sobre</a> </li>

            </ul>

        </nav>

    </body>

</html>
